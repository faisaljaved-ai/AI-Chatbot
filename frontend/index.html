<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FJ-TECH | Intelligent AI Command Center</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            fj: {
              bg: '#F7F8FC',
              surface: '#FFFFFF',
              navy: '#10152A',
              navyLight: '#161D38',
              indigo: '#635BFF',
              blue: '#3985FF',
              cyan: '#21C8D8',
              lavender: '#EEEAFE',
              mint: '#DDF8EE',
              amber: '#FFF1D6',
              rose: '#FFE6EA',
            }
          }
        }
      }
    };
  </script>

  <!-- Custom Design System Stylesheet -->
  <link rel="stylesheet" href="styles.css" />

  <!-- React 18 + ReactDOM 18 + Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="antialiased selection:bg-[#635BFF] selection:text-white">
  <div id="root"></div>

  <!-- Modular React Architecture -->
  <script type="text/babel" src="icons.js"></script>
  <script type="text/babel" src="views.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
